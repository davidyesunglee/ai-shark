    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "AI Shark Business Plan Assessor",
      "applicationCategory": "BusinessApplication",
      "operatingSystem": "Web",
      "url": "https://aishark.org",
      "description": "Upload a business plan (PDF, DOCX, or TXT) and receive an AI-generated assessment scored against bank debt financing criteria. Includes a lender readiness grade (A–F), 10 scoring criteria, SWOT analysis, market analysis, and 6 key financial ratios.",
      "offers": [
        {
          "@type": "Offer",
          "name": "One-Time Assessment",
          "price": "13.99",
          "priceCurrency": "USD",
          "description": "Single business plan evaluation"
        },
        {
          "@type": "Offer",
          "name": "Monthly Subscription",
          "price": "6.99",
          "priceCurrency": "USD",
          "description": "Two business plan evaluations per month",
          "priceSpecification": {
            "@type": "UnitPriceSpecification",
            "price": "6.99",
            "priceCurrency": "USD",
            "billingDuration": "P1M",
            "billingIncrement": "1"
          }
        }
      ]
    }
    </script>

    <!-- ── Structured Data: FAQ (rich snippet eligible) ─────────────── -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "How does AI Shark assess my business plan?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "AI Shark uses AI to review your business plan across 10 debt-financing considerations: creditworthiness, cash flow, collateral, debt-to-equity, market viability, management team, financial projections, revenue model, industry risk, and competitive position. A full report includes an overall score (0–100), a lender readiness grade (A–F), SWOT and market analysis, six financial ratios, and recommendations."
          }
        },
        {
          "@type": "Question",
          "name": "What file types can I upload?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "You can upload PDF, DOCX, or TXT files up to 10 MB. Most banks and SBA lenders prefer PDF format for business plans."
          }
        },
        {
          "@type": "Question",
          "name": "How much does AI Shark cost?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "A one-time assessment costs $13.99. A monthly subscription costs $6.99 per month and includes two business plan evaluations per month. Both options give you full access to the lender readiness grade, SWOT analysis, financial ratios, and PDF export."
          }
        },
        {
          "@type": "Question",
          "name": "What is a lender readiness grade?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "The Lender Readiness Grade is a letter grade (A through F) that summarizes how completely your plan addresses the areas reviewed. It is an informational assessment, not a prediction of a lending decision."
          }
        },
        {
          "@type": "Question",
          "name": "Will using AI Shark guarantee a bank loan approval?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "No. AI Shark provides analytical perspectives on your business plan for informational purposes only. The assessment does not imply any expectation of positive or negative outcomes from banking institutions and is not a guarantee of funding. Always consult with qualified financial professionals before making funding decisions."
          }
        }
      ]
    }
    </script>
